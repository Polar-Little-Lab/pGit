name: Dependency security audit
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Electron ships in the app despite being a devDependency. Audit the lockfile
      # without installing packages or running their lifecycle scripts.
      - run: npm audit --include=dev --audit-level=high
