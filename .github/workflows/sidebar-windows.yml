name: Windows UI regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidebar:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install chromium
      - name: Verify sidebar, staging, guide and setup
        shell: bash
        run: |
          node test/ui-sidebar.mjs
          node test/ui-inline-staging.mjs
          node test/ui-settings.mjs
          node test/ui-git-setup.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sidebar-windows
          path: test-results/
