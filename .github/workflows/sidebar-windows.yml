name: Windows sidebar regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidebar:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node test/ui-sidebar.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-windows
          path: test-results/
