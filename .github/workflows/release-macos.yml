name: Build desktop downloads
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Git test filesystem behavior
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - name: Enable Windows symbolic links
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Download and verify official Electron runtime
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $electronVersion = (Get-Content node_modules/electron/package.json | ConvertFrom-Json).version
          $archive = "electron-v$electronVersion-win32-x64.zip"
          $downloadDir = Join-Path $env:RUNNER_TEMP 'electron-official'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download "v$electronVersion" --repo electron/electron --pattern $archive --pattern SHASUMS256.txt --dir $downloadDir --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Official Electron download failed' }
            Start-Sleep -Seconds 5
          }
          $checksumLine = Get-Content (Join-Path $downloadDir 'SHASUMS256.txt') | Where-Object { $_ -match ('\s+\*?' + [regex]::Escape($archive) + '$') }
          if (!$checksumLine) { throw 'Official checksum entry missing' }
          $expected = ($checksumLine -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $downloadDir $archive) -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Electron checksum mismatch' }
          Expand-Archive (Join-Path $downloadDir $archive) node_modules/electron/dist -Force
          Set-Content node_modules/electron/path.txt 'electron.exe' -NoNewline -Encoding ascii
          Write-Host "Official Electron $electronVersion checksum verified: $actual"
      - run: npm audit --include=dev --audit-level=high
      - run: npm test
      - run: npx playwright install chromium
      - name: Verify history and review interfaces
        shell: bash
        run: |
          node test/ui-amend.mjs
          node test/ui-history-edits.mjs
          node test/ui-provider-review.mjs
          node test/ui-command-help.mjs
          node test/ui-project-home.mjs
          node test/ui-project-dialog.mjs
          node test/ui-direct-project-open.mjs
          node test/ui-project-groups.mjs
          node test/ui-group-curation.mjs
          node test/ui-finance-icons.mjs
          node test/ui-sidebar.mjs
          node test/ui-inline-staging.mjs
          node test/ui-new-file.mjs
          node test/ui-settings.mjs
          node test/ui-git-setup.mjs
      - name: Build macOS installers
        if: runner.os == 'macOS'
        shell: bash
        env:
          PGIT_MAC_SIGNING: ${{ vars.APPLE_SIGNING_ENABLED }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ "$PGIT_MAC_SIGNING" == true ]]; then
            : "${APPLE_API_KEY_BASE64:?Set APPLE_API_KEY_BASE64 before enabling signing}"
            export APPLE_API_KEY="$RUNNER_TEMP/pgit-notary-key.p8"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
            umask 077
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            npm run dist:mac -- --config desktop/signing/release-config.cjs
          else
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run dist:mac
          fi
      - name: Verify Developer ID and notarization tickets
        if: runner.os == 'macOS' && vars.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for app in dist/mac-arm64/pGit.app dist/mac/pGit.app; do
            codesign --verify --deep --strict "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win -- --config.electronDist=node_modules/electron/dist
      - name: Verify Mac bundles and launch
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/mac-arm64/pGit.app
          codesign --verify --deep --strict dist/mac/pGit.app
          if [ "$(uname -m)" = "arm64" ]; then APP_DIR=mac-arm64; else APP_DIR=mac; fi
          PGIT_APP_EXECUTABLE="$PWD/dist/$APP_DIR/pGit.app/Contents/MacOS/pGit" node test/desktop-smoke.mjs
      - name: Verify Windows installer and installed application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-windows-x64-setup.exe | Select-Object -First 1
          if (!$installer -or $installer.Length -eq 0) { throw 'Installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'pgit-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PGIT_APP_EXECUTABLE = Join-Path $installDir 'pGit.exe'
          if (!(Test-Path $env:PGIT_APP_EXECUTABLE)) { throw 'Installed application missing' }
          node test/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: pGit-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: test-results/
  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: pGit-*
          path: downloads
          merge-multiple: true
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_REF" == refs/tags/* && "${RELEASE_REF#refs/tags/}" != "$RELEASE_TAG" ]]; then
            echo 'Tag and package version must match' >&2
            exit 1
          fi
          cd downloads
          for file in "pGit-${RELEASE_TAG#v}-macos-arm64.dmg" "pGit-${RELEASE_TAG#v}-macos-arm64.zip" "pGit-${RELEASE_TAG#v}-macos-x64.dmg" "pGit-${RELEASE_TAG#v}-macos-x64.zip" "pGit-${RELEASE_TAG#v}-windows-x64-setup.exe"; do
            test -s "$file"
          done
          sha256sum * > SHA256SUMS.txt
          cp "$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--latest)
          fi
          gh release create "$RELEASE_TAG" ./* --target "$GITHUB_SHA" "${RELEASE_FLAGS[@]}" --title "pGit $RELEASE_TAG · Windows & macOS" --notes-file "$RUNNER_TEMP/release-notes.md"
