name: Build desktop downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Git test filesystem behavior
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - name: Enable Windows symbolic links
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - name: Verify history and review interfaces
        shell: bash
        run: |
          node test/ui-amend.mjs
          node test/ui-history-edits.mjs
          node test/ui-provider-review.mjs
          node test/ui-command-help.mjs
          node test/ui-project-dialog.mjs
          node test/ui-direct-project-open.mjs
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Verify Mac bundles and launch
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/mac-arm64/pGit.app
          codesign --verify --deep --strict dist/mac/pGit.app
          if [ "$(uname -m)" = "arm64" ]; then APP_DIR=mac-arm64; else APP_DIR=mac; fi
          PGIT_APP_EXECUTABLE="$PWD/dist/$APP_DIR/pGit.app/Contents/MacOS/pGit" node test/desktop-smoke.mjs
      - name: Verify Windows installer and installed application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-windows-x64-setup.exe | Select-Object -First 1
          if (!$installer -or $installer.Length -eq 0) { throw 'Installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'pgit-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PGIT_APP_EXECUTABLE = Join-Path $installDir 'pGit.exe'
          if (!(Test-Path $env:PGIT_APP_EXECUTABLE)) { throw 'Installed application missing' }
          node test/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: pGit-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: test-results/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pGit-*
          path: downloads
          merge-multiple: true
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd downloads
          sha256sum * > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Downloads
          - Windows 10/11 (64-bit): `windows-x64-setup.exe`
          - macOS Apple Silicon (M1/M2/M3/M4): `macos-arm64.dmg`
          - macOS Intel: `macos-x64.dmg`
          - ZIP archives are also available for macOS.

          Node.js is included. Install Git for Windows on Windows, or Xcode Command Line Tools on macOS before using local repositories.

          This preview is not signed with a Windows publisher certificate or notarized by Apple; the operating system may show an unidentified-publisher warning.

          Includes file-selective amend, earlier commit message editing, PR/MR context selection, and the redesigned commit history organizer. Automated Git/UI tests and packaged application launch checks run on Windows and macOS before publication. Windows installation is tested on Windows Server 2022; manual Windows 10/11 QA remains pending.
          NOTES
          gh release create "$RELEASE_TAG" ./* --target "$GITHUB_SHA" --prerelease --title "pGit $RELEASE_TAG · Windows & macOS" --notes-file "$RUNNER_TEMP/release-notes.md"
