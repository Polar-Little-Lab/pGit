name: Build Windows 10 and 11 installer
on:
  push:
    branches: [main, 'codex/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged app and restore a Windows project
        run: npm run test:desktop
        env:
          PGIT_APP_EXECUTABLE: dist/win-unpacked/pGit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pGit-windows-x64
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pGit-windows-desktop-smoke
          path: test-results/
