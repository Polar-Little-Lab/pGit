name: Verify Git workflows
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Configure Git test filesystem behavior
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - name: Enable Windows symbolic links
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PGIT_SCREENSHOT_LOG: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pGit-ui-verification-${{ matrix.os }}
          path: test-results/
  dependency-gate:
    name: Dependency update gate
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every platform test to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
