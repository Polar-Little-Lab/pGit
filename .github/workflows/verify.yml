name: Verify Git workflows
on:
  push:
    branches: ['feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PGIT_SCREENSHOT_LOG: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pGit-ui-verification-linux
          path: test-results/
