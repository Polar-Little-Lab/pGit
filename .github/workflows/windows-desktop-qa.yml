# Run on actual client OS machines, not the Windows Server hosted runners.
name: Windows 10 or 11 desktop QA
on:
  workflow_dispatch:
    inputs:
      os:
        description: Windows desktop runner label
        type: choice
        required: true
        options: [windows-10, windows-11]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: [self-hosted, Windows, X64, '${{ inputs.os }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test test/platform.test.mjs
      - run: npm run dist:win
      - run: npm run test:desktop
        env:
          PGIT_APP_EXECUTABLE: dist/win-unpacked/pGit.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-qa-${{ inputs.os }}
          path: test-results/
