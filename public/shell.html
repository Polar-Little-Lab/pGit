<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pGit · Arctic workspace</title><link rel="icon" href="/logo.png" type="image/png"><link rel="stylesheet" href="/frost.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/controls.css"><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/ui-components.css"><link rel="stylesheet" href="/interface-polish.css"></head><body>
<header class="project-bar"><button id="homeButton" class="icon-button" aria-label="프로젝트 홈"></button><div id="projectTabs" role="tablist" aria-label="열린 프로젝트"></div><button id="addProject" class="icon-button" aria-label="새 프로젝트 탭" title="새 탭 · ⌘/Ctrl+T">＋</button><button id="showTabs" class="icon-button" aria-label="열린 탭 검색" title="열린 탭 검색" aria-haspopup="dialog" aria-expanded="false"></button><button id="manageGroups" class="icon-button" aria-label="프로젝트 그룹" title="프로젝트 그룹"></button></header>
<main id="projectPanels"><section id="welcome" class="welcome">
<div class="home-header"><div class="home-brand"><span class="home-wordmark literal-data">pGit<span aria-hidden="true">.</span></span><span>프로젝트</span></div>
<div class="home-overview"><div class="welcome-actions home-start-actions"><button id="welcomeOpen" aria-label="프로젝트 열기"><span class="start-icon" data-home-icon="folder"></span><span><strong>프로젝트 열기</strong><small>내 컴퓨터의 Git 저장소</small></span><span class="start-arrow" aria-hidden="true">↗</span></button><button id="welcomeClone" aria-label="저장소 복제"><span class="start-icon" data-home-icon="fetch"></span><span><strong>저장소 복제</strong><small>원격 저장소를 내 컴퓨터로</small></span><span class="start-arrow" aria-hidden="true">↗</span></button><button id="welcomeInit" aria-label="새 저장소 만들기"><span class="start-icon" data-home-icon="plus"></span><span><strong>새 저장소 만들기</strong><small>폴더에서 Git 기록 시작</small></span><span class="start-arrow" aria-hidden="true">↗</span></button></div>
</div></div><section id="recentQuickSection" class="recent-quick-section" aria-labelledby="recentQuickTitle"><h2 id="recentQuickTitle">최근 프로젝트</h2><div id="recentQuickProjects" class="recent-quick-projects"></div></section><div class="recent-section"><div class="project-home-toolbar"><div class="section-heading"><h2 id="repositoryListTitle">저장소</h2><span id="recentCount"></span></div><input id="projectSearch" type="search" aria-label="프로젝트 검색" placeholder="이름 또는 경로로 검색" autocomplete="off"><button id="createHomeGroup" class="home-create-group">새 그룹</button></div><section id="homeGroups" class="home-groups" aria-label="프로젝트 그룹" hidden></section><div id="ungroupedHeading" hidden>그룹 없음</div><div class="recent-columns" aria-hidden="true"><span>저장소</span><span>최근 확인 브랜치</span><span>마지막으로 연 시간</span><span></span></div><div id="recentProjects" class="recent-list"></div></div>
<footer class="welcome-footer"><span class="literal-data powered-by">Powered by <strong>Polar</strong></span><span class="footer-shortcut"><kbd id="newTabShortcut">⌘T</kbd><span>새 탭</span></span></footer></section></main>
<dialog id="projectDialog" aria-labelledby="projectTitle"><form id="projectForm" novalidate><div class="dialog-heading"><div><span class="eyebrow">NEW PROJECT</span><h2 id="projectTitle">프로젝트 열기</h2></div><button type="button" id="closeProjectDialog" class="icon-button" aria-label="프로젝트 창 닫기">×</button></div><div class="project-fields"><div id="cloneUrlField" hidden><label for="cloneUrl">저장소 URL</label><input id="cloneUrl" aria-describedby="projectError" placeholder="https://github.com/team/project.git" autocomplete="off"></div><label for="projectPath" id="pathLabel">프로젝트 폴더</label><div class="path-field"><input id="projectPath" aria-describedby="projectHelp projectError" required placeholder="/Users/you/Projects/project" autocomplete="off"><button type="button" id="browseProject">찾아보기</button></div><p id="projectHelp">기존 Git 저장소를 새 탭으로 엽니다.</p><p id="projectError" role="alert"></p><div id="projectGitSetup" hidden></div></div><div class="dialog-actions"><button type="submit" id="submitProject" class="primary">프로젝트 열기</button></div></form></dialog>
<dialog id="closeTabDialog" aria-labelledby="closeTabTitle"><div class="dialog-heading"><h2 id="closeTabTitle">커밋 초안을 보관할까요?</h2></div><p>탭을 닫으면 이 탭의 커밋 메시지 초안이 사라집니다. 파일 변경과 스테이징 상태는 저장소에 남습니다.</p><div class="dialog-actions"><button id="keepTab">계속 작성</button><button id="discardTab">초안 버리고 탭 닫기</button></div></dialog>
<div id="shellNotice" role="status" hidden></div><script src="/path-utils.js"></script><script>const shellToken='__PGIT_TOKEN__';</script><script src="/command-help.js"></script><script src="/folder-picker.js"></script><script src="/icons.js"></script><script src="/ui-components.js"></script><script src="/locales.js"></script><script src="/i18n.js"></script><script src="/theme-catalog.js"></script><script src="/settings.js"></script><script src="/git-setup.js"></script><script src="/group-icon-catalog.js"></script><script src="/group-icon-picker.js"></script><script src="/project-groups.js"></script><script src="/shell.js"></script><script src="/tab-picker.js"></script><script src="/project-groups-ui.js"></script><script src="/guide.js"></script><script src="/tooltips.js"></script></body></html>
