<div class="recent-section"><div class="project-home-toolbar"><div class="section-heading"><h2>최근 프로젝트</h2><span id="recentCount"></span></div><input id="projectSearch" type="search" aria-label="프로젝트 검색" placeholder="이름 또는 경로로 검색" autocomplete="off"></div><div id="groupFilters" class="group-filters" aria-label="그룹 필터"></div><section id="homeGroups" class="home-groups" aria-label="프로젝트 그룹" hidden></section><div class="recent-columns" aria-hidden="true"><span>저장소</span><span>최근 확인 브랜치</span><span>마지막으로 연 시간</span><span></span></div><div id="recentProjects" class="recent-list"></div></div>

<dialog id="projectDialog" aria-labelledby="projectTitle"><form id="projectForm" novalidate><div class="dialog-heading"><div><span class="eyebrow">NEW PROJECT</span><h2 id="projectTitle">프로젝트 열기</h2></div><button type="button" id="closeProjectDialog" class="icon-button" aria-label="프로젝트 창 닫기">×</button></div><div class="project-fields"><div id="cloneUrlField" hidden><label for="cloneUrl">저장소 URL</label><input id="cloneUrl" aria-describedby="projectError" placeholder="https://github.com/team/project.git" autocomplete="off"></div><label for="projectPath" id="pathLabel">프로젝트 폴더</label><div class="path-field"><input id="projectPath" aria-describedby="projectHelp projectError" required placeholder="/Users/you/Projects/project" autocomplete="off"><button type="button" id="browseProject">찾아보기</button></div><p id="projectHelp">기존 Git 저장소를 새 탭으로 엽니다.</p><p id="projectError" role="alert"></p><div id="projectGitSetup" hidden></div></div><div class="dialog-actions"><button type="submit" id="submitProject" class="primary">프로젝트 열기</button></div></form></dialog>
<dialog id="closeTabDialog" aria-labelledby="closeTabTitle"><div class="dialog-heading"><h2 id="closeTabTitle">커밋 초안을 보관할까요?</h2></div><p>탭을 닫으면 이 탭의 커밋 메시지 초안이 사라집니다. 파일 변경과 스테이징 상태는 저장소에 남습니다.</p><div class="dialog-actions"><button id="keepTab">계속 작성</button><button id="discardTab">초안 버리고 탭 닫기</button></div></dialog>
