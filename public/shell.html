<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pGit · Arctic workspace</title><link rel="icon" href="/logo.png" type="image/png"><link rel="stylesheet" href="/frost.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/controls.css"><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/ui-components.css"></head><body>
<header class="project-bar"><button id="homeButton" class="icon-button" aria-label="프로젝트 홈"></button><div id="projectTabs" role="tablist" aria-label="열린 프로젝트"></div><button id="addProject" class="icon-button" aria-label="새 프로젝트 탭" title="새 프로젝트 · ⌘T">＋</button></header>
<main id="projectPanels"><section id="welcome" class="welcome">
<div class="project-home-heading"><div><h1>프로젝트</h1><p>프로젝트를 열거나 원격 저장소를 복제하세요.</p></div><div class="welcome-actions"><button id="welcomeInit">새 저장소 만들기</button><button id="welcomeClone">저장소 복제</button><button id="welcomeOpen" class="primary">프로젝트 열기</button></div></div>
<div class="recent-section"><div class="project-home-toolbar"><div class="section-heading"><h2>최근 프로젝트</h2><span id="recentCount"></span></div><input id="projectSearch" type="search" aria-label="프로젝트 검색" placeholder="이름 또는 경로로 검색" autocomplete="off"></div><div class="recent-columns" aria-hidden="true"><span>저장소</span><span>최근 확인 브랜치</span><span>마지막으로 연 시간</span><span></span></div><div id="recentProjects" class="recent-list"></div></div>
<footer class="welcome-footer"><span>목록에서 제거해도 저장소와 파일은 유지됩니다.</span><span>⌘T 새 프로젝트</span></footer></section></main>
<dialog id="projectDialog" aria-labelledby="projectTitle"><form id="projectForm" novalidate><div class="dialog-heading"><div><span class="eyebrow">NEW PROJECT</span><h2 id="projectTitle">프로젝트 열기</h2></div><button type="button" id="closeProjectDialog" class="icon-button" aria-label="프로젝트 창 닫기">×</button></div><div class="project-fields"><div class="project-options reference-modes" role="group" aria-label="프로젝트 추가 방식"><button type="button" data-project-mode="open" aria-pressed="true">로컬 열기</button><button type="button" data-project-mode="clone" aria-pressed="false">복제</button><button type="button" data-project-mode="init" aria-pressed="false">새로 만들기</button></div><div id="cloneUrlField" hidden><label for="cloneUrl">저장소 URL</label><input id="cloneUrl" aria-describedby="projectError" placeholder="https://github.com/team/project.git" autocomplete="off"></div><label for="projectPath" id="pathLabel">프로젝트 폴더</label><div class="path-field"><input id="projectPath" aria-describedby="projectHelp projectError" required placeholder="/Users/you/Projects/project" autocomplete="off"><button type="button" id="browseProject">찾아보기</button></div><p id="projectHelp">기존 Git 저장소를 새 탭으로 엽니다.</p><p id="projectError" role="alert"></p></div><div class="dialog-actions"><button type="submit" id="submitProject" class="primary">프로젝트 열기</button></div></form></dialog>
<dialog id="closeTabDialog" aria-labelledby="closeTabTitle"><div class="dialog-heading"><h2 id="closeTabTitle">커밋 초안을 보관할까요?</h2></div><p>탭을 닫으면 이 탭의 커밋 메시지 초안이 사라집니다. 파일 변경과 스테이징 상태는 저장소에 남습니다.</p><div class="dialog-actions"><button id="keepTab">계속 작성</button><button id="discardTab">초안 버리고 탭 닫기</button></div></dialog>
<div id="shellNotice" role="status" hidden></div><script src="/path-utils.js"></script><script>const shellToken='__PGIT_TOKEN__';</script><script src="/command-help.js"></script><script src="/folder-picker.js"></script><script src="/icons.js"></script><script src="/ui-components.js"></script><script src="/locales.js"></script><script src="/i18n.js"></script><script src="/theme-catalog.js"></script><script src="/settings.js"></script><script src="/shell.js"></script><script src="/guide.js"></script><script src="/tooltips.js"></script></body></html>
