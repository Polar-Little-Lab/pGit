function controls(){updateCommitControls();$('reset').disabled=working;$('openRepo').disabled=working;document.querySelectorAll('.file-stage').forEach(el=>el.disabled=working)}

async function loadDiff(){syncDiffControls();const id=++diffRequest;if(!selected){$('filename').textContent='파일을 선택하세요';showDiff('');return}const name=selected;$('filename').replaceChildren(el('span',name,'literal-data'),el('span',staged?' · 커밋할 변경':' · 작업 폴더'));showDiff('변경 내용을 불러오는 중…');try{const text=await api('diff',{name,staged});if(id===diffRequest)showDiff(text||'이 영역에는 변경 사항이 없습니다.')}catch(e){if(id===diffRequest)showDiff(e.message)}}
function render(){if(!state)return;$('openRepo').textContent=state.root.split('/').pop();$('openRepo').title=state.root;$('status').textContent=state.root;$('branchPicker').textContent=state.branch;$('footBranch').textContent=state.branch;$('count').textContent=' · '+state.files.length;renderChangesFiles();$('branches').replaceChildren();for(const br of state.branches){const b=document.createElement('button');b.className='nav branchitem';b.dataset.ref='refs/heads/'+br.name;b.textContent=br.name;const sm=document.createElement('small');sm.textContent=(br.current?'현재 · ':'')+br.hash.slice(0,7);b.append(sm);b.onclick=()=>chooseHistoryRef('refs/heads/'+br.name,br.hash);$('branches').append(b)}renderHistory();controls();loadDiff()}
function ancestry(hash){const seen=new Set();function visit(h){if(seen.has(h))return;seen.add(h);(state.history.find(c=>c.hash===h)?.parents||[]).forEach(visit)}visit(hash);return seen}
// Pure graph layout: each lane carries the hash of a pending parent.
function graphRows(commits){let lanes=[],width=1;return commits.map(c=>{const before=lanes.slice();let lane=lanes.indexOf(c.hash);if(lane<0){lane=lanes.indexOf(null);if(lane<0)lane=lanes.length;lanes[lane]=c.hash}const active=lanes.slice();lanes[lane]=null;const parents=c.parents||[];const targets=[];parents.forEach((p,i)=>{let target=lanes.indexOf(p);if(target<0){target=i===0&&lanes[lane]===null?lane:lanes.indexOf(null);if(target<0)target=lanes.length;lanes[target]=p}targets.push(target)});width=Math.max(width,lanes.length,active.length);return {lane,before,after:lanes.slice(),targets,width}})}
let historyQuery='',detailRequest=0,historyLimit=200;
const palette=['#367fa3','#9872bd','#c39839','#40a18a','#cf748a'];
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function renderHistory(){const host=$('history'),scroll=host.querySelector('.history-scroll')?.scrollTop||0;host.replaceChildren();

const scroller=el('div',undefined,'history-scroll');scroller.id='historyScroll';const head=el('div',undefined,'history-head');for(const t of ['브랜치 / 태그','그래프','커밋 메시지','작성자','커밋','날짜'])head.append(el('span',t));scroller.append(head);const list=el('div');list.id='commitRows';scroller.append(list);host.append(scroller);

}
function drawRows(){const list=$('commitRows');if(!list)return;list.replaceChildren();if(!state){list.append(el('div','저장소를 열어 브랜치와 커밋 흐름을 확인하세요.','empty'));return}const allowed=scope?ancestry(scope):null;const historyBase=typeof filteredGraphHistory==='function'?filteredGraphHistory():state.history;const base=historyBase.filter(c=>!allowed||allowed.has(c.hash));const q=historyQuery.trim().toLowerCase();const commits=base.filter(c=>!q||(c.title+' '+c.author+' '+c.hash).toLowerCase().includes(q));const info=document.querySelector('.history-info');if(info){info.textContent=q?`검색 결과 ${commits.length}개 / ${base.length}개`: `${base.length}개 커밋`;info.title=state.limited?'불러온 이력 안에서 검색합니다.':''}const layouts=graphRows(commits);const width=Math.max(4,...layouts.map(r=>r.width))*16+24;$('historyScroll').style.setProperty('--graph-width',width+'px');
commits.forEach((c,i)=>{const g=layouts[i],row=el('button',undefined,'historyrow');row.dataset.hash=c.hash;row.title=c.title;row.setAttribute('aria-pressed',String(activeCommit===c.hash));const x=n=>12+n*16;let paths='';const line=(a,b,color)=>`<path d="${a} ${b}" stroke="${color}" stroke-width="1.8" fill="none"/>`;

if(!commits.length)list.append(el('div',q?'일치하는 커밋이 없습니다.':state.history.length?'표시할 커밋이 없습니다.':'아직 커밋이 없습니다.','empty'));
