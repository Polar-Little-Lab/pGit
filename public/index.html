<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pGit · Frost prototype</title><style>
:root{--canvas:#f3f8fc;--surface:#fff;--soft:#e7eff6;--text:#213347;--muted:#586d80;--border:#c8d8e5;--accent:#32678c;--danger:#b44848}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,select{height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 16px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface)}.brand{font-weight:750;font-size:24px;letter-spacing:-1px;margin-right:24px}.badge{padding:5px 8px;background:var(--soft);border-radius:6px;color:var(--accent);font-size:11px}.spacer{flex:1}.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 104px)}aside{padding:24px 16px;border-right:1px solid var(--border)}.caption{font-size:11px;font-weight:650;letter-spacing:1.5px;color:var(--muted);margin:24px 8px 12px}.nav{display:block;width:100%;text-align:left;border:0;margin-bottom:4px;background:transparent}.active{background:var(--soft)!important;color:var(--accent);font-weight:650}.sub{padding:12px 16px;color:var(--muted)}main{padding:32px;min-width:0}h1{font-size:24px;letter-spacing:-.7px;margin:0 0 8px}p{color:var(--muted);line-height:1.7}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.card{border:1px solid var(--border);background:var(--surface);border-radius:10px;overflow:hidden}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:440px}.files{border-right:1px solid var(--border)}.bar{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.file{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--soft)}.file button{padding:0 4px;border:0;background:transparent;text-align:left;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file input{accent-color:var(--accent)}.kind{font:11px monospace;color:var(--accent)}pre{font:12px/2 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;overflow:auto;padding:16px;min-height:300px}.line{display:block;white-space:pre}.add{background:var(--soft);color:var(--accent)}.del{background:#fcf0f0;color:var(--danger)}.commitbox{padding:16px;border-top:1px solid var(--border);display:flex;gap:12px}input[type=text]{height:40px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);min-width:0;flex:1}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#285573}.empty{padding:48px;text-align:center;color:var(--muted)}footer{height:32px;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;font-size:11px;color:var(--muted)}.historyrow{display:grid;grid-template-columns:32px 1fr 100px;align-items:center;gap:16px;padding:20px;border-bottom:1px solid var(--soft)}.dot{height:10px;width:10px;border:2px solid var(--accent);border-radius:50%}.historyrow small{display:block;margin-top:6px;color:var(--muted)}#toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:8px;background:var(--text);color:white;display:none}.note{margin-top:16px;font-size:12px}.branch{font-family:monospace}@media(max-width:900px){.shell{grid-template-columns:170px 1fr}main{padding:20px}.workspace{grid-template-columns:1fr}.files{border-right:0}.top{flex-wrap:wrap}}@media(max-width:620px){aside{display:none}.shell{grid-template-columns:1fr}header{padding:12px;gap:8px}.brand{margin-right:0}.commitbox{flex-wrap:wrap}main{padding:16px}}

.picker{min-width:200px;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left}.chevron{width:16px;height:16px}.file input{appearance:none;width:18px;height:18px;border:1px solid var(--border);border-radius:4px;background:var(--surface);flex-shrink:0;cursor:pointer}.file input:checked{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}dialog{border:1px solid var(--border);border-radius:10px;padding:0;width:380px;max-width:calc(100vw - 32px);color:var(--text);box-shadow:0 20px 70px #21334726}dialog::backdrop{background:#21334735}dialog .body{padding:16px}dialog input{width:100%;margin-bottom:12px}.option{height:54px;width:100%;border:0;text-align:left;display:flex;justify-content:space-between;align-items:center}.option small{color:var(--muted)}.branchitem{height:auto;min-height:48px;white-space:normal;overflow-wrap:anywhere}.branchitem small{display:block;font-weight:400;color:var(--muted);margin-top:5px}.historyrow{width:100%;height:auto;border:0;border-bottom:1px solid var(--soft);border-radius:0;text-align:left;grid-template-columns:64px 1fr 80px;background:var(--surface);padding:0 16px;min-height:72px}.graph{width:64px;height:72px;display:block}.historylayout{display:grid;grid-template-columns:minmax(0,1fr) 280px}.details{padding:24px;border-left:1px solid var(--border);background:var(--canvas)}.details h3{line-height:1.5;margin-top:0}.details p{font-size:12px;overflow-wrap:anywhere}.details code{font-size:11px}.filterbar{display:flex;gap:8px;padding:16px;border-bottom:1px solid var(--border);align-items:center}.filterbar input{width:120px}.filterbar button{padding:0 12px}.headpill{background:var(--accent);color:white}.branchmarker{display:inline-block;margin-left:8px;font:11px -apple-system,sans-serif;background:var(--soft);color:var(--accent);border-radius:4px;padding:3px 6px}@media(max-width:1100px){.historylayout{grid-template-columns:1fr}.details{border-left:0;border-top:1px solid var(--border)}}
</style><header><span class="brand">pGit<span style="color:var(--accent)">.</span></span><button id="openRepo" class="picker">저장소 열기</button><span class="badge">Frost</span><span class="spacer"></span><span class="badge">로컬 Git</span><button id="reset">새로고침</button></header><div class="shell"><aside><div class="caption">WORKSPACE</div><button class="nav active" id="changesNav">변경 사항 <span id="count"></span></button><button class="nav" id="historyNav">커밋 이력</button><div class="caption">LOCAL BRANCHES</div><div id="branches"></div><div class="caption">REPOSITORY</div><div class="sub">로컬 작업 공간</div><p style="padding:8px;font-size:12px">변경을 확인하고,<br>필요한 파일만 커밋하세요.</p></aside><main><div class="top"><div><h1 id="heading">변경 사항</h1><p style="margin:0" id="subtitle">작은 변경부터, 명확한 기록으로.</p></div><span class="spacer"></span><span id="branchPicker" class="badge branch">—</span></div><section id="changes" class="card"><div class="workspace"><div class="files"><div class="bar"><strong>변경된 파일</strong><span class="badge">파일별 스테이징</span></div><div id="files"></div></div><div><div class="bar"><strong id="filename"></strong><span class="badge">Unified diff</span></div><pre id="diff"></pre></div></div><form id="form" class="commitbox"><input id="message" type="text" maxlength="200" placeholder="이 변경으로 무엇이 달라졌나요?" aria-label="커밋 메시지" autocomplete="off"><button class="primary" id="commit" disabled>선택한 파일 커밋</button></form></section><section id="history" class="card" hidden></section><p class="note">스테이징·커밋은 실제 저장소에 반영됩니다. 기존에 스테이징된 변경도 커밋에 포함됩니다.</p></main></div><footer><span id="status">저장소를 열어 주세요</span><span id="footBranch">main</span><span class="spacer"></span><span>pGit 0.1 · Local development</span></footer><div id="toast" role="status"></div><dialog id="pickerDialog" aria-labelledby="pickerTitle"><div class="bar"><strong id="pickerTitle">저장소 선택</strong><button id="closePicker" aria-label="선택 창 닫기">닫기</button></div><div class="body"><input id="pickerSearch" type="text" aria-label="목록 검색" placeholder="이름으로 검색"><div id="pickerOptions"></div></div></dialog>

<dialog id="repoDialog" aria-labelledby="openTitle"><form id="openForm"><div class="bar"><strong id="openTitle">로컬 저장소 열기</strong><button type="button" id="closeOpen">닫기</button></div><div class="body"><label for="pathInput">Git 작업 폴더의 절대 경로</label><input id="pathInput" type="text" required placeholder="/Users/polar/Projects/pGit"><button class="primary">열기</button></div></form></dialog><dialog id="detailDialog" style="width:900px"><div class="bar"><strong>커밋 Diff</strong><button id="closeDetails">닫기</button></div><pre id="detailText" style="max-height:70vh"></pre></dialog><script>
const $=id=>document.getElementById(id);let state=null,selected=null,staged=false,activeCommit=null,working=false,mode='changes',scope=null,diffRequest=0;
const token='__PGIT_TOKEN__';
function notify(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').style.display='none',5000)}
async function api(action,data={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Pgit-Token':token},body:JSON.stringify({action,...data})});const body=await r.json();if(!r.ok)throw Error(body.error||'요청 실패');return body.result}
async function mutate(action,data={}){if(working)return;working=true;controls();try{state=await api(action,data);render();return true}catch(e){notify(e.message);return false}finally{working=false;controls()}}
function controls(){$('commit').disabled=working||!state?.files.some(f=>f.index!==' '&&f.index!=='?')||!$('message').value.trim();$('reset').disabled=working;$('openRepo').disabled=working;document.querySelectorAll('.file input').forEach(el=>el.disabled=working||el.dataset.conflict==='true')}
function showDiff(text){$('diff').replaceChildren();for(const line of text.split('\n')){const el=document.createElement('span');el.className='line '+(line.startsWith('+')?'add':line.startsWith('-')?'del':'');el.textContent=line;$('diff').append(el)}}
async function loadDiff(){const id=++diffRequest;if(!selected){$('filename').textContent='파일을 선택하세요';showDiff('');return}const name=selected;$('filename').textContent=name+(staged?' · 스테이징됨':' · 작업 폴더');showDiff('변경 내용을 불러오는 중…');try{const text=await api('diff',{name,staged});if(id===diffRequest)showDiff(text||'이 영역에는 변경 사항이 없습니다.')}catch(e){if(id===diffRequest)showDiff(e.message)}}
function render(){if(!state)return;$('openRepo').textContent=state.root.split('/').pop();$('openRepo').title=state.root;$('status').textContent=state.root;$('branchPicker').textContent=state.branch;$('footBranch').textContent=state.branch;$('count').textContent=' · '+state.files.length;$('files').replaceChildren();if(!state.files.find(f=>f.name===selected)){selected=state.files[0]?.name||null;staged=false}for(const f of state.files){const row=document.createElement('div');row.className='file'+(selected===f.name?' active':'');const check=document.createElement('input');check.type='checkbox';check.checked=f.index!==' '&&f.index!=='?';check.dataset.conflict=f.conflict;check.setAttribute('aria-label',f.name+' 스테이징');check.onchange=async()=>{await mutate('stage',{name:f.name,value:check.checked})};const b=document.createElement('button');b.textContent=f.name;b.title=f.name;b.onclick=()=>{selected=f.name;staged=false;render()};const kind=document.createElement('span');kind.className='kind';kind.textContent=f.conflict?'충돌':f.untracked?'새 파일':f.index+f.worktree;row.append(check,b,kind);$('files').append(row)}if(!state.files.length)$('files').innerHTML='<div class="empty">작업 공간이 깨끗합니다.</div>';$('branches').replaceChildren();for(const br of state.branches){const b=document.createElement('button');b.className='nav branchitem'+(br.current?' active':'');b.textContent=br.name;const sm=document.createElement('small');sm.textContent=(br.current?'현재 · ':'')+br.hash.slice(0,7);b.append(sm);b.onclick=()=>{scope=br.hash;activeCommit=br.hash;tab('history');renderHistory()};$('branches').append(b)}renderHistory();controls();loadDiff()}
function ancestry(hash){const seen=new Set();function visit(h){if(seen.has(h))return;seen.add(h);(state.history.find(c=>c.hash===h)?.parents||[]).forEach(visit)}visit(hash);return seen}
function renderHistory(){const host=$('history');host.replaceChildren();if(!state)return;const bar=document.createElement('div');bar.className='filterbar';const all=document.createElement('button');all.textContent='전체 브랜치';all.onclick=()=>{scope=null;renderHistory()};const info=document.createElement('span');info.textContent=scope?'선택한 브랜치 이력':'최근 커밋'+(state.limited?' · 최대 200개':'');bar.append(all,info);host.append(bar);const layout=document.createElement('div');layout.className='historylayout';const rows=document.createElement('div'),details=document.createElement('div');details.className='details';layout.append(rows,details);host.append(layout);const allowed=scope?ancestry(scope):null;const commits=state.history.filter(c=>!allowed||allowed.has(c.hash));if(!commits.length)rows.innerHTML='<div class="empty">아직 커밋이 없습니다.</div>';for(const c of commits){const row=document.createElement('button');row.className='historyrow'+(activeCommit===c.hash?' active':'');const dot=document.createElement('span');dot.className='dot';const text=document.createElement('div');text.textContent=c.title;for(const br of state.branches.filter(b=>b.hash===c.hash)){const tag=document.createElement('span');tag.className='branchmarker';tag.textContent=br.name+(br.current?' · HEAD':'');text.append(tag)}const sm=document.createElement('small');sm.textContent=c.author+' · '+new Date(c.date).toLocaleString();text.append(sm);const hash=document.createElement('code');hash.textContent=c.hash.slice(0,7);row.append(dot,text,hash);row.onclick=()=>{activeCommit=c.hash;renderHistory()};rows.append(row)}const c=commits.find(c=>c.hash===activeCommit)||commits[0];if(c){const h=document.createElement('h3');h.textContent=c.title;details.append(h);for(const t of [c.hash,'작성자: '+c.author,'부모: '+(c.parents.map(x=>x.slice(0,7)).join(', ')||'없음')]){const p=document.createElement('p');p.textContent=t;details.append(p)}const button=document.createElement('button');button.textContent='커밋 Diff 보기';button.onclick=async()=>{try{const text=await api('commitDiff',{hash:c.hash});$('detailText').textContent=text;$('detailDialog').showModal()}catch(e){notify(e.message)}};details.append(button)}}
function tab(m){mode=m;$('changes').hidden=m!=='changes';$('history').hidden=m!=='history';$('changesNav').classList.toggle('active',m==='changes');$('historyNav').classList.toggle('active',m==='history');$('heading').textContent=m==='changes'?'변경 사항':'커밋 이력'}
$('changesNav').onclick=()=>tab('changes');$('historyNav').onclick=()=>tab('history');$('message').oninput=controls;$('reset').onclick=()=>state?mutate('state'):openDialog();
function openDialog(){$('pathInput').value=state?.root||'';$('repoDialog').showModal();$('pathInput').focus()}
$('openRepo').onclick=openDialog;$('openForm').onsubmit=async e=>{e.preventDefault();selected=null;scope=null;activeCommit=null;if(await mutate('open',{path:$('pathInput').value.trim()}))$('repoDialog').close()};$('closeOpen').onclick=()=>$('repoDialog').close();$('form').onsubmit=async e=>{e.preventDefault();if($('commit').disabled)return;if(await mutate('commit',{message:$('message').value})){$('message').value='';controls();notify('커밋을 생성했습니다.')}};
const diffToggle=document.createElement('button');diffToggle.textContent='스테이징 Diff 보기';diffToggle.onclick=()=>{staged=!staged;diffToggle.textContent=staged?'작업 폴더 Diff 보기':'스테이징 Diff 보기';loadDiff()};$('filename').parentElement.lastElementChild.replaceWith(diffToggle);$('closeDetails').onclick=()=>$('detailDialog').close();showDiff('저장소를 열면 변경 내용을 확인할 수 있습니다.');controls();
</script></html>
